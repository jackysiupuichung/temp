[project]
name = "journal-club"
version = "0.1.0"
description = "Library Journal Club: paper agents map, debate and propose directions, backtested against held-out papers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "claude-agent-sdk>=0.2.168",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "typer>=0.12",
]

[project.scripts]
jc = "journal_club.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["journal_club"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API; skipped unless JC_LIVE=1"]
