<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Helvetica, Arial, sans-serif">
  <title>Library Journal Club organisation schematic</title>
  <desc>One lab. The scientist sets the agenda for a convener, who chairs the meeting with a standing critic and a scribe. The twenty papers sit in one meeting: one presents, the two nearest discuss, the rest may pass or disagree. The scribe writes to the archive, Zotero and the minutes, which return to the scientist. Numbered arrows give the order of events in one session; the band at the bottom lists the three overnight sessions.</desc>
  <style>
    .t { font-size: 12px; fill: #1f2937; }
    .ts { font-size: 10.5px; fill: #4b5563; }
    .tb { font-size: 12.5px; font-weight: 700; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12px; fill: #4b5563; }
    .cont { fill: none; stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .contlbl { font-size: 12px; font-weight: 700; fill: #374151; }
    .scientist { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.5; }
    .chair { fill: #f8cecc; stroke: #b85450; stroke-width: 1.5; }
    .paper { fill: #ffffff; stroke: #6c8ebf; stroke-width: 1.5; }
    .lab { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.5; }
    .archive { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.5; }
    .output { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.5; }
    .session { fill: #f5f5f5; stroke: #666666; stroke-width: 1.5; }
    .edge { fill: none; stroke: #374151; stroke-width: 1.6; }
    .edge2 { fill: none; stroke: #374151; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .num { fill: #111827; }
    .numt { font-size: 10px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#374151"/>
    </marker>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 2h6v2h-1v5l6 10a2 2 0 0 1-1.7 3H5.7A2 2 0 0 1 4 19l6-10V4H9z"/></symbol>
    <symbol id="i-gavel" viewBox="0 0 24 24"><rect x="2" y="19" width="10" height="3" rx="1"/><rect x="5" y="9" width="12" height="4" rx="1" transform="rotate(-45 11 11)"/><rect x="12" y="1" width="5" height="9" rx="1" transform="rotate(-45 14.5 5.5)"/></symbol>
    <symbol id="i-magnifier" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke-width="2.6"/><path d="M14.5 14.5l6.5 6.5" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M3 21l3.5-1L18 8.5l-2.5-2.5L4 17.5z"/><path d="M16.5 5l2-2 2.5 2.5-2 2z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5z" stroke-width="1.6"/><path d="M14 2v5h5M8 12h8M8 15h8M8 18h5" fill="none" stroke-width="1.6"/></symbol>
    <symbol id="i-docs" viewBox="0 0 24 24"><path d="M8 5h8l4 4v12H8z" stroke-width="1.6"/><path d="M4 2h8v3H8v14H4z" stroke-width="1.6"/><path d="M11 13h6M11 16h6" fill="none" stroke-width="1.6"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5" fill="none" stroke-width="2"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" fill="none" stroke-width="2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 3h8v18H3z"/><path d="M13 3h8v18h-8z"/></symbol>
    <symbol id="i-minutes" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="18" rx="2" fill="none" stroke-width="2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 11h8M8 15h8M8 19h5" fill="none" stroke-width="1.8"/></symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text x="30" y="36" class="title">Library Journal Club — one lab, familiar roles</text>
  <text x="30" y="56" class="sub">You → PI → PhD students (one per paper). One lab meeting, one shared transcript. Numbers 1–9 give the order of events in one meeting.</text>

  <!-- Scientist -->
  <rect x="30" y="85" width="170" height="90" rx="8" class="scientist"/>
  <use href="#i-flask" x="42" y="98" width="30" height="30" fill="#d79b00"/>
  <text x="82" y="112" class="tb">You (the scientist)</text>
  <text x="82" y="128" class="ts">sets the agenda once</text>
  <text x="82" y="142" class="ts">reads the minutes</text>
  <text x="82" y="156" class="ts">settles "unresolved"</text>

  <!-- Chair container -->
  <rect x="300" y="68" width="640" height="162" rx="6" class="cont"/>
  <text x="310" y="83" class="contlbl">Senior staff</text>

  <rect x="520" y="85" width="200" height="60" rx="8" class="chair"/>
  <use href="#i-gavel" x="530" y="100" width="28" height="28" fill="#b85450"/>
  <text x="566" y="106" class="tb">PI</text>
  <text x="566" y="121" class="ts">runs the meeting, sums up,</text>
  <text x="566" y="135" class="ts">decides; must "choose one"</text>

  <rect x="320" y="160" width="200" height="55" rx="8" class="chair"/>
  <use href="#i-magnifier" x="330" y="174" width="26" height="26" fill="#b85450" stroke="#b85450"/>
  <text x="366" y="180" class="tb">Senior postdoc</text>
  <text x="366" y="195" class="ts">the tough reviewer: do the</text>
  <text x="366" y="208" class="ts">quotes exist? feedback only</text>

  <rect x="720" y="160" width="200" height="55" rx="8" class="chair"/>
  <use href="#i-pen" x="730" y="174" width="26" height="26" fill="#b85450"/>
  <text x="766" y="180" class="tb">Lab manager</text>
  <text x="766" y="195" class="ts">keeps the minutes,</text>
  <text x="766" y="208" class="ts">updates Zotero, events.jsonl</text>

  <!-- 1 agenda -->
  <path d="M200 105H520" class="edge" marker-end="url(#ah)"/>
  <circle cx="260" cy="105" r="9" class="num"/><text x="260" y="108.5" class="numt" text-anchor="middle">1</text>
  <text x="275" y="100" class="t">agenda question</text>

  <!-- critic -> convener -->
  <path d="M420 160V130H520" class="edge" marker-end="url(#ah)"/>
  <text x="428" y="126" class="ts">evidence check</text>

  <!-- 6 convener -> scribe -->
  <path d="M720 130H820V160" class="edge" marker-end="url(#ah)"/>
  <circle cx="770" cy="130" r="9" class="num"/><text x="770" y="133.5" class="numt" text-anchor="middle">6</text>
  <text x="812" y="152" class="ts" text-anchor="end">decisions, verdicts</text>

  <!-- 2/4 convener <-> lab -->
  <path d="M620 145V268" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <circle cx="620" cy="200" r="9" class="num"/><text x="620" y="203.5" class="numt" text-anchor="middle">2</text>
  <text x="634" y="196" class="t">opens ↓</text>
  <circle cx="620" cy="250" r="9" class="num"/><text x="620" y="253.5" class="numt" text-anchor="middle">4</text>
  <text x="634" y="254" class="t">sums up each round ↑</text>

  <!-- 5 critic -> lab -->
  <path d="M340 215V268" class="edge2" marker-end="url(#ah)"/>
  <circle cx="318" cy="243" r="9" class="num"/><text x="318" y="246.5" class="numt" text-anchor="middle">5</text>
  <text x="306" y="247" class="ts" text-anchor="end">speaks last, every round</text>

  <!-- The lab -->
  <rect x="200" y="268" width="760" height="190" rx="6" class="lab"/>
  <text x="212" y="286" class="contlbl">The lab meeting: 20 PhD students, one per paper, one shared transcript (Virtual Lab team meeting)</text>

  <rect x="220" y="305" width="200" height="56" rx="6" class="paper"/>
  <use href="#i-doc" x="228" y="321" width="24" height="24" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="260" y="325" class="tb">Presenting student</text>
  <text x="260" y="340" class="ts">one paper per turn: its</text>
  <text x="260" y="353" class="ts">claim, evidence, limits</text>

  <rect x="455" y="305" width="110" height="56" rx="6" class="paper"/>
  <use href="#i-doc" x="461" y="321" width="22" height="22" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="488" y="325" class="tb">Student 2</text>
  <text x="488" y="340" class="ts">closest topic,</text>
  <text x="488" y="353" class="ts">discusses</text>
  <rect x="575" y="305" width="110" height="56" rx="6" class="paper"/>
  <use href="#i-doc" x="581" y="321" width="22" height="22" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="608" y="325" class="tb">Student 3</text>
  <text x="608" y="340" class="ts">2nd closest,</text>
  <text x="608" y="353" class="ts">discusses</text>

  <rect x="720" y="305" width="220" height="56" rx="6" class="paper"/>
  <use href="#i-docs" x="728" y="321" width="24" height="24" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="760" y="325" class="tb">Rest of the lab (17 students)</text>
  <text x="760" y="340" class="ts">may "pass", or disagree</text>
  <text x="760" y="353" class="ts">and name the paper</text>

  <!-- 3 present -> discuss -> members -->
  <path d="M420 333H455" class="edge" marker-end="url(#ah)"/>
  <circle cx="437" cy="333" r="9" class="num"/><text x="437" y="336.5" class="numt" text-anchor="middle">3</text>
  <path d="M565 333H575" class="edge" marker-end="url(#ah)"/>
  <path d="M685 333H720" class="edge" marker-end="url(#ah)"/>

  <text x="212" y="386" class="t">Speaking order each round: presenting student → two discussing students → rest of the lab → postdoc → PI sums up. 2–3 rounds per item.</text>
  <text x="212" y="404" class="ts">Scores: the two discussing students rate Support, Soundness, Significance, Originality 1–4; the PI keeps the scores in the summary.</text>
  <text x="212" y="419" class="ts">Disputes: when two students' papers clash, each defends with quotes for 2 turns; the PI rules stands / contested / unresolved.</text>
  <text x="212" y="434" class="ts">Collaborations: the PI pairs two students and asks for one combination ("C's method on D's data could test X"); the postdoc checks feasibility.</text>
  <text x="212" y="449" class="ts">Only the PI's structured summary leaves the meeting; the transcript stays in the lab.</text>

  <!-- 7 scribe -> archive -->
  <path d="M920 187H975V525H940" class="edge" marker-end="url(#ah)"/>
  <circle cx="975" cy="360" r="9" class="num"/><text x="975" y="363.5" class="numt" text-anchor="middle">7</text>
  <text x="988" y="240" class="t" transform="rotate(90 988 240)">append to events.jsonl after every round</text>

  <!-- Bottom row -->
  <rect x="740" y="490" width="200" height="70" rx="8" class="archive"/>
  <use href="#i-db" x="750" y="510" width="30" height="30" fill="#d6b656" stroke="#d6b656"/>
  <text x="790" y="512" class="tb">Archive</text>
  <text x="790" y="527" class="ts">events.jsonl, never discard</text>
  <text x="790" y="541" class="ts">claims, verdicts, proposals</text>

  <rect x="500" y="490" width="180" height="70" rx="8" class="output"/>
  <use href="#i-book" x="510" y="510" width="30" height="30" fill="#82b366"/>
  <text x="550" y="512" class="tb">Zotero</text>
  <text x="550" y="527" class="ts">a note on each paper</text>
  <text x="550" y="541" class="ts">that was involved</text>

  <rect x="260" y="490" width="180" height="70" rx="8" class="output"/>
  <use href="#i-minutes" x="270" y="510" width="30" height="30" fill="#82b366" stroke="#82b366"/>
  <text x="310" y="512" class="tb">Minutes</text>
  <text x="310" y="527" class="ts">+ network view:</text>
  <text x="310" y="541" class="ts">green collab, red dispute</text>

  <!-- 8 archive -> zotero, minutes -->
  <path d="M740 525H680" class="edge" marker-end="url(#ah)"/>
  <circle cx="710" cy="525" r="9" class="num"/><text x="710" y="528.5" class="numt" text-anchor="middle">8</text>
  <path d="M840 560V580H350V560" class="edge" marker-end="url(#ah)"/>
  <circle cx="600" cy="580" r="9" class="num"/><text x="600" y="583.5" class="numt" text-anchor="middle">8</text>
  <text x="612" y="575" class="ts">written back after meeting 3</text>

  <!-- 9 minutes -> scientist -->
  <path d="M260 525H120V175" class="edge" marker-end="url(#ah)"/>
  <circle cx="120" cy="340" r="9" class="num"/><text x="120" y="343.5" class="numt" text-anchor="middle">9</text>
  <text x="134" y="344" class="t">in the morning</text>

  <!-- Session band -->
  <rect x="30" y="615" width="945" height="80" rx="6" class="cont"/>
  <text x="40" y="631" class="contlbl">Overnight: the lab meets three times</text>
  <rect x="45" y="642" width="290" height="40" rx="6" class="session"/>
  <text x="55" y="659" class="tb">Meeting 1 · Introductions</text>
  <text x="55" y="674" class="ts">every student presents their paper; the PI lists the conflicts</text>
  <path d="M335 662H355" class="edge" marker-end="url(#ah)"/>
  <rect x="355" y="642" width="290" height="40" rx="6" class="session"/>
  <text x="365" y="659" class="tb">Meeting 2 · Journal club debate</text>
  <text x="365" y="674" class="ts">the students in conflict argue; stands / contested / unresolved</text>
  <path d="M645 662H665" class="edge" marker-end="url(#ah)"/>
  <rect x="665" y="642" width="295" height="40" rx="6" class="session"/>
  <text x="675" y="659" class="tb">Meeting 3 · Brainstorm</text>
  <text x="675" y="674" class="ts">the PI pairs students; one idea per pair; final minutes</text>
</svg>
