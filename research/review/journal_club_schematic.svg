<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <title>Library Journal Club — the loop</title>
  <desc>The simplest self-improving loop. You set the agenda. Twenty PhD-student agents, one per paper, each write one note. The PI scores the notes. Everything goes into an archive with its score. The next round starts by reading the best of the archive. Three rounds overnight, then you read the minutes.</desc>
  <style>
    .t { font-size: 12.5px; fill: #1f2937; }
    .ts { font-size: 11px; fill: #4b5563; }
    .tb { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12px; fill: #4b5563; }
    .you { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.5; }
    .pi { fill: #f8cecc; stroke: #b85450; stroke-width: 1.5; }
    .students { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.5; }
    .archive { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.5; }
    .edge { fill: none; stroke: #374151; stroke-width: 2; }
    .num { fill: #111827; }
    .numt { font-size: 10px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#374151"/>
    </marker>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 2h6v2h-1v5l6 10a2 2 0 0 1-1.7 3H5.7A2 2 0 0 1 4 19l6-10V4H9z"/></symbol>
    <symbol id="i-gavel" viewBox="0 0 24 24"><rect x="2" y="19" width="10" height="3" rx="1"/><rect x="5" y="9" width="12" height="4" rx="1" transform="rotate(-45 11 11)"/><rect x="12" y="1" width="5" height="9" rx="1" transform="rotate(-45 14.5 5.5)"/></symbol>
    <symbol id="i-docs" viewBox="0 0 24 24"><path d="M8 5h8l4 4v12H8z" stroke-width="1.6"/><path d="M4 2h8v3H8v14H4z" stroke-width="1.6"/><path d="M11 13h6M11 16h6" fill="none" stroke-width="1.6"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5" fill="none" stroke-width="2"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" fill="none" stroke-width="2"/></symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="30" y="36" class="title">Library Journal Club — the loop</text>
  <text x="30" y="56" class="sub">One round = read the archive → write a note → PI scores → keep everything. Run it three times overnight.</text>

  <!-- You -->
  <rect x="30" y="200" width="170" height="80" rx="8" class="you"/>
  <use href="#i-flask" x="42" y="222" width="30" height="30" fill="#d79b00"/>
  <text x="82" y="232" class="tb">You</text>
  <text x="82" y="249" class="ts">set the agenda at 10 pm</text>
  <text x="82" y="263" class="ts">read the minutes at 8 am</text>

  <!-- Students -->
  <rect x="290" y="110" width="260" height="90" rx="8" class="students"/>
  <use href="#i-docs" x="302" y="134" width="34" height="34" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="348" y="140" class="tb">20 PhD students</text>
  <text x="348" y="157" class="ts">one per paper in your library</text>
  <text x="348" y="171" class="ts">each writes one note per round:</text>
  <text x="348" y="185" class="ts">a claim, a critique, or an idea</text>

  <!-- PI -->
  <rect x="700" y="110" width="260" height="90" rx="8" class="pi"/>
  <use href="#i-gavel" x="712" y="134" width="34" height="34" fill="#b85450"/>
  <text x="758" y="140" class="tb">PI</text>
  <text x="758" y="157" class="ts">scores every note 1–5</text>
  <text x="758" y="171" class="ts">checks the quotes exist in the source</text>
  <text x="758" y="185" class="ts">one line: what was weak this round</text>

  <!-- Archive -->
  <rect x="495" y="330" width="260" height="90" rx="8" class="archive"/>
  <use href="#i-db" x="507" y="354" width="34" height="34" fill="#d6b656" stroke="#d6b656"/>
  <text x="553" y="360" class="tb">Archive</text>
  <text x="553" y="377" class="ts">every note, with its score</text>
  <text x="553" y="391" class="ts">never deleted</text>
  <text x="553" y="405" class="ts">minutes + Zotero notes are read from it</text>

  <!-- 0 You -> students -->
  <path d="M200 240H250V155H290" class="edge" marker-end="url(#ah)"/>
  <text x="206" y="232" class="ts">agenda</text>

  <!-- 1 students -> PI -->
  <path d="M550 155H700" class="edge" marker-end="url(#ah)"/>
  <circle cx="625" cy="155" r="10" class="num"/><text x="625" y="159" class="numt" text-anchor="middle">1</text>
  <text x="625" y="140" class="t" text-anchor="middle">20 notes</text>

  <!-- 2 PI -> archive -->
  <path d="M830 200V375H755" class="edge" marker-end="url(#ah)"/>
  <circle cx="830" cy="290" r="10" class="num"/><text x="830" y="294" class="numt" text-anchor="middle">2</text>
  <text x="814" y="294" class="t" text-anchor="end">notes + scores + weak-spot line</text>

  <!-- 3 archive -> students -->
  <path d="M495 375H420V200" class="edge" marker-end="url(#ah)"/>
  <circle cx="420" cy="290" r="10" class="num"/><text x="420" y="294" class="numt" text-anchor="middle">3</text>
  <text x="404" y="294" class="t" text-anchor="end">next round: each student reads</text>
  <text x="404" y="309" class="t" text-anchor="end">the 5 best notes + the weak-spot line</text>

  <!-- 4 archive -> you -->
  <path d="M625 420V460H115V280" class="edge" marker-end="url(#ah)"/>
  <circle cx="370" cy="460" r="10" class="num"/><text x="370" y="464" class="numt" text-anchor="middle">4</text>
  <text x="386" y="453" class="t">after round 3: minutes + Zotero notes</text>

  <!-- loop label -->
  <text x="625" y="262" class="tb" text-anchor="middle">× 3 rounds</text>
  <text x="625" y="279" class="ts" text-anchor="middle">~25 calls per round, ~80 for the night</text>
</svg>
