<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Helvetica, Arial, sans-serif">
  <title>Library Journal Club — where is the field going</title>
  <desc>Your Zotero library is split at a date T. Papers before T become PhD-student agents who meet in three rounds: map the pairwise agreements and clashes, debate the clashes, then write research directions with evidence. A PI chairs. The directions are checked against the papers after T, which were held out, giving a hit rate against a no-discussion baseline. You get the minutes: directions, evidence, hit rate.</desc>
  <style>
    .t { font-size: 12px; fill: #1f2937; }
    .ts { font-size: 10.5px; fill: #4b5563; }
    .tb { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12px; fill: #4b5563; }
    .lib { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.5; }
    .you { fill: #ffe6cc; stroke: #d79b00; stroke-width: 1.5; }
    .pi { fill: #f8cecc; stroke: #b85450; stroke-width: 1.5; }
    .students { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.5; }
    .held { fill: #f5f5f5; stroke: #666666; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .round { fill: #ffffff; stroke: #6c8ebf; stroke-width: 1.5; }
    .archive { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.5; }
    .evalb { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; }
    .cont { fill: #eef3fb; stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .contlbl { font-size: 12px; font-weight: 700; fill: #374151; }
    .edge { fill: none; stroke: #374151; stroke-width: 2; }
    .edge2 { fill: none; stroke: #374151; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .key { fill: none; stroke: #2e7d32; stroke-width: 3; }
    .keyt { fill: #1b5e20; font-weight: 700; font-size: 12px; }
    .num { fill: #111827; }
    .numt { font-size: 10px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 3h8v18H3z"/><path d="M13 3h8v18h-8z"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 2h6v2h-1v5l6 10a2 2 0 0 1-1.7 3H5.7A2 2 0 0 1 4 19l6-10V4H9z"/></symbol>
    <symbol id="i-gavel" viewBox="0 0 24 24"><rect x="2" y="19" width="10" height="3" rx="1"/><rect x="5" y="9" width="12" height="4" rx="1" transform="rotate(-45 11 11)"/><rect x="12" y="1" width="5" height="9" rx="1" transform="rotate(-45 14.5 5.5)"/></symbol>
    <symbol id="i-docs" viewBox="0 0 24 24"><path d="M8 5h8l4 4v12H8z" stroke-width="1.6"/><path d="M4 2h8v3H8v14H4z" stroke-width="1.6"/><path d="M11 13h6M11 16h6" fill="none" stroke-width="1.6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke-width="2.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke-width="2.4"/><path d="M7.5 12.5l3 3 6-7" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5" fill="none" stroke-width="2"/></symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text x="30" y="36" class="title">Library Journal Club — where is the field going?</text>
  <text x="30" y="56" class="sub">Papers before a date T talk; they name the directions the field will take; the papers after T, held out, say whether they were right.</text>

  <!-- Library -->
  <rect x="30" y="90" width="210" height="64" rx="8" class="lib"/>
  <use href="#i-book" x="42" y="107" width="30" height="30" fill="#82b366"/>
  <text x="82" y="114" class="tb">Your Zotero library</text>
  <text x="82" y="131" class="ts">split once at a date T</text>
  <text x="82" y="145" class="ts">(e.g. T = 2 years ago)</text>

  <!-- Before T -->
  <rect x="30" y="200" width="210" height="84" rx="8" class="students"/>
  <use href="#i-docs" x="42" y="222" width="30" height="30" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="82" y="222" class="tb">Before T</text>
  <text x="82" y="239" class="ts">8 papers → 8 PhD students</text>
  <text x="82" y="253" class="ts">each knows one paper: claim,</text>
  <text x="82" y="267" class="ts">evidence, limits</text>

  <!-- After T (held out) -->
  <rect x="30" y="470" width="210" height="84" rx="8" class="held"/>
  <use href="#i-lock" x="42" y="492" width="30" height="30" fill="#666666" stroke="#666666"/>
  <text x="82" y="492" class="tb">After T</text>
  <text x="82" y="509" class="ts">held out: the students</text>
  <text x="82" y="523" class="ts">never see these papers</text>
  <text x="82" y="537" class="ts">they are the answer key</text>

  <path d="M135 154V200" class="edge" marker-end="url(#ah)"/>
  <path d="M60 154V175H20V512H30" class="edge" marker-end="url(#ah)"/>

  <!-- Club container -->
  <rect x="290" y="90" width="420" height="440" rx="8" class="cont"/>
  <text x="302" y="108" class="contlbl">The journal club: three rounds, one night</text>

  <rect x="310" y="120" width="380" height="92" rx="6" class="round"/>
  <circle cx="330" cy="140" r="10" class="num"/><text x="330" y="144" class="numt" text-anchor="middle">1</text>
  <text x="348" y="144" class="tb">Map</text>
  <text x="348" y="161" class="ts">every pair of papers: agree / disagree / share a limitation</text>
  <text x="348" y="175" class="ts">each verdict cites one passage from each paper</text>
  <text x="348" y="189" class="ts">output: the clash list and the shared-limitation list</text>
  <text x="348" y="203" class="ts">28 pairs, 1 call each</text>

  <path d="M500 212V232" class="edge" marker-end="url(#ah)"/>

  <rect x="310" y="232" width="380" height="92" rx="6" class="round"/>
  <circle cx="330" cy="252" r="10" class="num"/><text x="330" y="256" class="numt" text-anchor="middle">2</text>
  <text x="348" y="256" class="tb">Debate</text>
  <text x="348" y="273" class="ts">for each clash: both students defend with quotes, 2 turns</text>
  <text x="348" y="287" class="ts">PI rules: stands / contested / unresolved</text>
  <text x="348" y="301" class="ts">output: what the library disagrees about and why</text>
  <text x="348" y="315" class="ts">cap 5 clashes</text>

  <path d="M500 324V344" class="edge" marker-end="url(#ah)"/>

  <rect x="310" y="344" width="380" height="106" rx="6" class="round"/>
  <circle cx="330" cy="364" r="10" class="num"/><text x="330" y="368" class="numt" text-anchor="middle">3</text>
  <text x="348" y="368" class="tb">Directions</text>
  <text x="348" y="385" class="ts">from the unresolved clashes and the shared limitations,</text>
  <text x="348" y="399" class="ts">the PI writes 5–10 directions:</text>
  <text x="348" y="413" class="ts" font-style="italic">"the field will move from A to B, because papers 3 and 7 both hit L"</text>
  <text x="348" y="427" class="ts">each with: the papers behind it, the passages, a confidence</text>
  <text x="348" y="441" class="ts">a direction without before-T quotes is thrown out</text>

  <rect x="310" y="470" width="380" height="44" rx="6" class="archive"/>
  <use href="#i-db" x="320" y="480" width="24" height="24" fill="#d6b656" stroke="#d6b656"/>
  <text x="352" y="488" class="tb">Archive</text>
  <text x="352" y="503" class="ts">map, verdicts, directions with evidence; next week starts from here</text>

  <!-- Before T -> round 1 -->
  <path d="M240 242H275V166H310" class="edge" marker-end="url(#ah)"/>

  <!-- PI -->
  <rect x="740" y="120" width="230" height="92" rx="8" class="pi"/>
  <use href="#i-gavel" x="752" y="146" width="30" height="30" fill="#b85450"/>
  <text x="792" y="144" class="tb">PI</text>
  <text x="792" y="161" class="ts">chairs all three rounds</text>
  <text x="792" y="175" class="ts">checks that every quote exists</text>
  <text x="792" y="189" class="ts">must rank the directions</text>
  <text x="792" y="203" class="ts">and give each a confidence</text>
  <path d="M740 166H710" class="edge2" marker-end="url(#ah)"/>

  <!-- Evaluator -->
  <rect x="740" y="344" width="230" height="106" rx="8" class="evalb"/>
  <use href="#i-check" x="752" y="358" width="30" height="30" fill="none" stroke="#2e7d32"/>
  <text x="792" y="368" class="keyt">Backtest</text>
  <text x="792" y="385" class="ts">for each direction: did an after-T</text>
  <text x="792" y="399" class="ts">paper in your library do it?</text>
  <text x="792" y="413" class="ts">→ hit rate</text>
  <text x="792" y="427" class="ts">baseline: one LLM call, same papers,</text>
  <text x="792" y="441" class="ts">no discussion → its hit rate</text>

  <path d="M690 397H740" class="key" marker-end="url(#ahg)"/>

  <!-- After T -> evaluator -->
  <path d="M240 522H725V450" class="key" marker-end="url(#ahg)"/>
  <text x="480" y="546" class="keyt" text-anchor="middle">the answer key, opened only here</text>

  <!-- You -->
  <rect x="740" y="480" width="230" height="74" rx="8" class="you"/>
  <use href="#i-flask" x="752" y="498" width="30" height="30" fill="#d79b00"/>
  <text x="792" y="503" class="tb">You, in the morning</text>
  <text x="792" y="520" class="ts">minutes: the directions, the evidence,</text>
  <text x="792" y="534" class="ts">the disagreements, the hit rate</text>
  <text x="792" y="548" class="ts">vs the baseline</text>
  <path d="M855 450V480" class="edge" marker-end="url(#ah)"/>

  <!-- Footer -->
  <text x="30" y="590" class="tb">Why this goal</text>
  <text x="30" y="608" class="ts">A direction is what a journal club produces, and it is checkable. ASCollab's agents re-derived findings that were published months later; here that is the design, not a side effect.</text>
  <text x="30" y="623" class="ts">The hit rate is the external check a multi-round loop needs; without one, an LLM scorer flattens in 3–4 rounds and drifts toward its own taste.</text>
  <text x="30" y="648" class="tb">Leakage guard</text>
  <text x="30" y="666" class="ts">The model may know the after-T papers from training. A direction counts only with before-T quotes behind it; score on after-T papers newer than the model's cutoff</text>
  <text x="30" y="681" class="ts">where you can; always report the no-discussion baseline next to the club's hit rate. ~60 calls per night.</text>
  <text x="30" y="701" class="t">On stage: "In 2023 your papers pointed to X. You saved a 2025 paper that did X."</text>
</svg>
